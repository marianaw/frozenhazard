[project]
name = "frozenhazard"
version = "0.1.0"
description = "Survival analysis via tabular foundation models (AFT + Buckley-James imputation)"
requires-python = "==3.11.*"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "lifelines",
    "pycox",
    "scikit-survival",
    "tabpfn",
    "tabicl",
    "optax",
]

[project.optional-dependencies]
# Local (CPU):   uv sync --extra cpu
# GPU server:    uv sync --extra gpu
cpu = ["jax[cpu]"]
gpu = ["jax[cuda12]", "torch"]

# PyTorch (pulled transitively by tabpfn/pycox/tabicl) defaults to CPU wheels.
# On the GPU server, override by pointing uv at the CUDA index:
#   uv sync --extra gpu --index https://download.pytorch.org/whl/cu124
# Adjust cu124 -> cu118/cu121 to match the server's CUDA version.
[tool.uv]
package = false
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", extra = "gpu" },
]
